# The app version. This is the only place it is set.
# Override for a single build with -Papp.version=x.y.z (make package / release do this).
# Must be x.y.z with x >= 1 (macOS installers require it).
app.version=1.0.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
