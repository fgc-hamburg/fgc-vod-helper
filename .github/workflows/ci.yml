name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache bundled video tools
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fgc-vod-helper/video-tools
          key: video-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildSrc/src/main/kotlin/**/VideoToolPins.kt') }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v make || choco install make -y --no-progress
          make --version | head -1

      - name: Check
        run: make check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'

  package:
    name: package (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache bundled video tools
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fgc-vod-helper/video-tools
          key: video-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('buildSrc/src/main/kotlin/**/VideoToolPins.kt') }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v make || choco install make -y --no-progress
          make --version | head -1

      - name: Package
        run: make package

      - name: Check bundled video tools
        run: make verify-package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
